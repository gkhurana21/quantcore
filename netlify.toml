# Netlify build configuration for the QuantCore dashboard.
# The site source lives in dashboard/ (Next.js 14 static export → dashboard/out).
# With this file committed, a connected Netlify site auto-builds correctly on
# every push to the default branch — no manual build-settings needed.

[build]
  base    = "dashboard"
  command = "npm run build"
  publish = "out"

[build.environment]
  NODE_VERSION = "20"
  # the hosted terminal fetches market data from the Netlify Function below (same origin)
  NEXT_PUBLIC_PROXY_URL = "/api"

# Read-only Alpaca market data (dashboard/netlify/functions/market.ts, served at /api/*).
# Needs ALPACA_API_KEY_ID and ALPACA_API_SECRET_KEY in the site's environment; without them
# it answers "not configured" and the terminal stays on snapshot prices.
[functions]
  directory = "netlify/functions"

# Static export already emits 404.html; no SPA rewrite needed (single route).
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy        = "strict-origin-when-cross-origin"
