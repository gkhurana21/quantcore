# Netlify build configuration for the QuantCore dashboard.
# The site source lives in dashboard/ (Next.js 15 static export → dashboard/out). The Netlify site is linked to
# GitHub, so every push to main builds and deploys with these settings.

[build]
  base    = "dashboard"
  # version.txt records the commit this deploy was built from; the Production workflow waits for it to match the
  # pushed commit before it marks the GitHub deployment successful
  command = "npm run build && printf '%s\\n' \"$COMMIT_REF\" > out/version.txt"
  publish = "out"

[build.environment]
  NODE_VERSION = "20"
  # The hosted terminal runs on snapshot prices and never calls a market-data proxy, so it loads with no requests
  # beyond its own files. To serve live quotes instead, set the Alpaca keys below and change this to "/api".
  NEXT_PUBLIC_PROXY_URL = "disabled"

# Read-only Alpaca market data (dashboard/netlify/functions/market.ts, served at /api/*). Deployed, but unused while
# NEXT_PUBLIC_PROXY_URL is "disabled". Needs ALPACA_API_KEY_ID and ALPACA_API_SECRET_KEY in the site's environment;
# without them it answers "not configured".
[functions]
  directory = "netlify/functions"

# Static export already emits 404.html; no SPA rewrite needed (single route).
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy        = "strict-origin-when-cross-origin"
