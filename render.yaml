# Render blueprint for the market-data proxy.
#
#   1. Push this repo to GitHub
#   2. render.com -> New -> Blueprint -> pick the repo
#   3. Paste the two Alpaca values when prompted (they are marked sync:false,
#      so they are never stored in git)
#
# Free tier spins the service down after ~15 min idle; the next request wakes
# it in roughly 50 s. The dashboard already degrades to snapshots on timeout,
# so a cold start shows indicative data rather than an error.
services:
  - type: web
    name: quantcore-proxy
    runtime: docker
    plan: free
    region: oregon
    rootDir: proxy
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    envVars:
      - key: ALPACA_API_KEY_ID
        sync: false
      - key: ALPACA_API_SECRET_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        value: https://gaurangkhurana.ca,https://www.gaurangkhurana.ca,https://quantcore-gk.netlify.app
      - key: PORT
        value: "8080"
