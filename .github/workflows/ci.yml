name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The terminal: lint, types, the pricing/risk/import unit tests, the static export, then the browser suite
  # against that export. The engine specs skip here (no native engine in this job) and say so in the log.
  web:
    runs-on: ubuntu-24.04   # pinned: Playwright's chromium does not install on ubuntu-latest (26.04) yet
    timeout-minutes: 30
    defaults:
      run:
        working-directory: dashboard
    env:
      NEXT_PUBLIC_PROXY_URL: disabled   # snapshot prices: nothing in the tests may call the live market-data proxy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Browser tests (the exported site, chromium)
        run: npm run test:e2e
        env:
          QC_STATIC: '1'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            dashboard/playwright-report
            dashboard/test-results
          retention-days: 7

  # The C++17 core on Linux/gcc: the Metal kernel and Accelerate SIMD compile out, as in deploy/engine.Dockerfile.
  # Builds the pybind11 module too, then checks the WebSocket protocol against it.
  engine:
    runs-on: ubuntu-24.04   # pinned: Playwright's chromium does not install on ubuntu-latest (26.04) yet
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: server/requirements.txt
      - name: Dependencies
        run: pip install pybind11==2.13.6 -r server/requirements.txt
      - name: Build the core, the acceptance gate and the Python module
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DQUANTCORE_NATIVE_ARCH=OFF -DQUANTCORE_ACCELERATE=OFF \
            -DPython3_EXECUTABLE="$(which python)"
          cmake --build build -j "$(nproc)"
      - name: Acceptance gate (phase1_validation)
        # the gate prints FAIL on a miss and always exits 0, so the log is what is checked, as in the engine image
        run: |
          ./build/tests/phase1_validation | tee gate.log | tail -8
          ! grep -q "FAIL" gate.log
      - name: WebSocket protocol check
        run: python server/protocol_check.py
